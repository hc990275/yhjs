stream {
    # ----------------------------------------
    # 1. Minecraft Java 版反向代理 (纯 TCP)
    # ----------------------------------------
    server {
        # 监听本地的 25565 端口（仅 TCP）
        listen 25565;
        
        # 转发到你的源站 IP 和端口
        proxy_pass 218.161.50.241:25565;
        
        # TCP 会话保持时间（MC 建议长一点，防止玩家挂机被断开）
        proxy_timeout 600s;
        # 连接源站的超时时间
        proxy_connect_timeout 10s;
    }

    # ----------------------------------------
    # 2. Minecraft 基岩版反向代理 (纯 UDP)
    # ----------------------------------------
    server {
        # 监听本地的 19132 端口（必须加上 udp 关键字）
        listen 19132 udp;
        
        # 转发到你的源站 IP 和基岩版端口
        proxy_pass 218.161.50.241:19132;
        
        # UDP 会话保持时间 (UDP是无连接的，靠超时判断会话结束)
        proxy_timeout 60s;
        proxy_responses 1;
    }
}
